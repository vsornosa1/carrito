<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f1" />
    <meta
      name="description"
      content="Carrito lee las etiquetas de los 4.300 productos de Mercadona: qué llevan, cuánto azúcar y cuántos aditivos. Y te enseña una alternativa mejor del mismo pasillo. Gratis, sin cuentas y sin anuncios."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- A page built to be shared needs a card, or every share is a bare link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carrito" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://carrito.dev/" />
    <meta property="og:title" content="Carrito — sabe qué hay dentro de lo que compras" />
    <meta
      property="og:description"
      content="Lee las etiquetas de los 4.300 productos de Mercadona: aditivos, procesamiento y macros. Y te enseña una alternativa mejor del mismo pasillo. Gratis, sin cuentas y sin anuncios."
    />
    <!-- A page built to be shared needs a card, or every share is a bare link.
         Rendered by a real browser at 1200×630 (see the note in docs/LAUNCH.md):
         no font rasteriser here, and a browser is one. -->
    <meta property="og:image" content="https://carrito.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Carrito — sabe qué hay dentro de lo que compras" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Carrito — sabe qué hay dentro de lo que compras</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      No service worker on this page, on purpose. It is registered from /app and
      scoped there, so a stranger arriving from a shared link transfers a page rather
      than the 5.8 MB catalogue. See src/landing/main.tsx.
    -->
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
